name: Sync to dev.to

on:
  push:
    branches: [main]
    paths:
      - "src/content/blog/**"
      - "public/blog/**"
      - "scripts/sync-devto.mjs"
      - "scripts/lib/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync posts to dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node scripts/sync-devto.mjs --write --require-key

      # main is protected, so the bot cannot push to it directly. The devtoId
      # is only a cache (the sync matches articles by canonical URL), so the
      # write-back goes through a pull request and never fails the run.
      - name: Open PR with devtoId write-back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/content/blog
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          branch="chore/devto-ids-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore: persist dev.to article ids [skip ci]"
          if git push origin "$branch" && gh pr create \
              --base main --head "$branch" \
              --title "chore: persist dev.to article ids" \
              --body "Stores the dev.to article ids created by sync run ${{ github.run_id }}. Safe to merge; the sync also matches articles by canonical URL, so nothing breaks if this waits."; then
            echo "Opened pull request from $branch"
          else
            echo "::warning::Could not open a devtoId write-back PR. The dev.to sync itself succeeded."
          fi
